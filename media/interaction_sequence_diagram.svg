<svg viewBox="0 0 980 815" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text x="490" y="20" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">VITAWELD — Operator interaction workflow</text>

  <!-- Lifelines -->
  <line x1="130" y1="86" x2="130" y2="712" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="370" y1="86" x2="370" y2="712" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="620" y1="86" x2="620" y2="712" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="860" y1="86" x2="860" y2="712" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Lane headers -->
  <rect x="40"  y="30" width="180" height="56" rx="8" fill="#2563eb"/>
  <text x="130" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Operator</text>
  <rect x="280" y="30" width="180" height="56" rx="8" fill="#0d9488"/>
  <text x="370" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Conversational Agent</text>
  <text x="370" y="73" text-anchor="middle" font-size="11" fill="#d1fae5">(Mission Controller — open module)</text>
  <rect x="530" y="30" width="180" height="56" rx="8" fill="#7c3aed"/>
  <text x="620" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Tools</text>
  <text x="620" y="73" text-anchor="middle" font-size="11" fill="#ede9fe">(Tasks / Skills)</text>
  <rect x="770" y="30" width="180" height="56" rx="8" fill="#ea580c"/>
  <text x="860" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Robot Cell</text>

  <!-- 1 -->
  <line x1="130" y1="145" x2="370" y2="145" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="138" text-anchor="middle" font-size="12" fill="#0f172a">1. Natural-language request — start welding job</text>

  <!-- 2 -->
  <line x1="370" y1="197" x2="620" y2="197" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="495" y="183" text-anchor="middle" font-size="12" fill="#0f172a">2. Task 1 — Prepare welding job</text>
  <text x="495" y="196" text-anchor="middle" font-size="10.5" fill="#475569">(workpiece &amp; weld-candidate selection)</text>

  <!-- 3 -->
  <line x1="620" y1="240" x2="370" y2="240" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="495" y="233" text-anchor="middle" font-size="12" fill="#0f172a">3. Candidates returned</text>

  <!-- 4 -->
  <line x1="370" y1="285" x2="130" y2="285" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="278" text-anchor="middle" font-size="12" fill="#0f172a">4. Present candidates / ask confirmation</text>

  <!-- 5 -->
  <line x1="130" y1="330" x2="370" y2="330" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="323" text-anchor="middle" font-size="12" fill="#0f172a">5. Tasks 2-3 — Confirm positioning &amp; parameters</text>

  <!-- 6 -->
  <line x1="370" y1="382" x2="620" y2="382" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="495" y="368" text-anchor="middle" font-size="12" fill="#0f172a">6. Task 4 — Plan weld trajectory</text>
  <text x="495" y="381" text-anchor="middle" font-size="10.5" fill="#475569">(trajectory generation · PlanWeldPro.srv)</text>

  <!-- 7 -->
  <line x1="620" y1="425" x2="370" y2="425" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="495" y="418" text-anchor="middle" font-size="12" fill="#0f172a">7. Planned trajectory</text>

  <!-- 8 -->
  <line x1="370" y1="470" x2="130" y2="470" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="463" text-anchor="middle" font-size="12" fill="#0f172a">8. Task 4 — Display trajectory for review</text>

  <!-- Approval gate -->
  <rect x="60" y="495" width="380" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="130" y1="521" x2="370" y2="521" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="514" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">9. EXPLICIT APPROVAL to execute</text>
  <text x="250" y="545" text-anchor="middle" font-size="10.5" font-style="italic" fill="#92400e">Human approval is mandatory before any robot motion</text>

  <!-- 10 -->
  <line x1="370" y1="590" x2="860" y2="590" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="615" y="583" text-anchor="middle" font-size="12" fill="#0f172a">10. Task 5 — Execute weld (execution + source control)</text>

  <!-- 11 -->
  <line x1="860" y1="640" x2="370" y2="640" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="615" y="626" text-anchor="middle" font-size="12" fill="#0f172a">11. Tasks 6 &amp; 8 — Quality assessment + process monitoring</text>
  <text x="615" y="639" text-anchor="middle" font-size="10.5" fill="#475569">(RobotStatus · FIWARE entity update)</text>

  <!-- 12 -->
  <line x1="370" y1="685" x2="130" y2="685" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="678" text-anchor="middle" font-size="12" fill="#0f172a">12. Report results / completion</text>

  <!-- Footer: Task 7 + interruption -->
  <rect x="40" y="730" width="910" height="58" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="495" y="754" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">Task 7 — Workspace-safety supervision runs continuously throughout</text>
  <text x="495" y="773" text-anchor="middle" font-size="11" fill="#991b1b">Interruption available at any time: hardware E-stop and ROS4HRI crossed-arms gesture — independent of the AI stack</text>
</svg>
